name: Build and Push to ECR

on: 
     push:
        # pull_requests:
        #     braches: ['main', 'dev']
        branches: ['main']


permissions:
    id-token: write
    contents: read

jobs:
  build_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Code
        uses: actions/checkout@v7

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: 0

      - name: Build Docker Image
        run: docker build -t ${{ secrets.ECR_REPO }}/my-repo:latest .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.ECR_REPO }}/my-repo:latest
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.ECR_REPO }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image to Ecr
        run: docker push ${{ secrets.ECR_REPO }}/my-repo:latest

  Deploy_to_ecs:
    needs: build_scan
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.ECR_REPO }}

      - name: Deploy to Ecs
        run: echo "Deploy to ecs"
